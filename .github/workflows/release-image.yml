# Builds the runtime image for linux/amd64 and linux/arm64 on native runners
# and publishes one multi-arch tag set to GHCR.
#
#   git tag v0.1.0 && git push origin v0.1.0
#     -> ghcr.io/bldg-7/m-gated:0.1.0, :0.1, :latest, :sha-<short>
#   Actions > release-image > Run workflow (any branch)
#     -> ghcr.io/bldg-7/m-gated:<branch>, :sha-<short>
name: release-image

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/bldg-7/m-gated
  # Shared by both metadata steps so image labels and tags agree.
  # latest follows the newest non-prerelease semver tag (flavor latest=auto).
  # A bare major tag is skipped while the version is 0.x.
  META_TAGS: |
    type=semver,pattern={{version}}
    type=semver,pattern={{major}}.{{minor}}
    type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
    type=ref,event=branch
    type=sha

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web test and build
        working-directory: web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build

      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Rust fmt, clippy and test
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          # Tests that need a dedicated PostgreSQL, Node fixtures or a browser
          # are #[ignore]d and run locally with the scripts/ helpers.
          cargo test --locked

  build:
    name: build (${{ matrix.platform }})
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ env.META_TAGS }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only; tags are attached in the merge job after both
      # platforms pass the package check.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Package check
        run: scripts/test-package.sh
        env:
          MGATED_PACKAGE_IMAGE: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish tags
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ env.META_TAGS }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          args=()
          while IFS= read -r tag; do args+=(--tag "$tag"); done \
            < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r annotation; do args+=(--annotation "$annotation"); done \
            < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          refs=()
          for digest in *; do refs+=("$IMAGE@sha256:$digest"); done
          test "${#refs[@]}" -eq 2
          docker buildx imagetools create "${args[@]}" "${refs[@]}"

      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
        env:
          VERSION: ${{ steps.meta.outputs.version }}
