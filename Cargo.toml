[package]
name = "m-gated"
version = "0.3.1"
edition = "2024"
rust-version = "1.93"
description = "LLM API gateway with SSO, per-user budgets and a strict cost ledger"
license = "MIT"
repository = "https://github.com/Bldg-7/m-gated"
publish = false

[dependencies]
axum = { version = "=0.8.8", default-features = false, features = ["http1", "json", "tokio"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
serde_yaml_ng = "=0.10.0"
url = "=2.5.8"
tokio = { version = "=1.49.0", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
http-body = "=1.0.1"
h2 = "=0.4.20"
tower = { version = "=0.5.3", features = ["util"] }
httparse = "=1.10.1"
hyper = { version = "=1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "=0.1.21", features = ["server-auto", "service", "tokio"] }
uuid = { version = "=1.20.0", features = ["v4", "serde"] }

jsonwebtoken = "=9.3.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
subtle = "=2.6.1"
getrandom = "=0.2.17"
sha2 = "=0.10.9"
base64 = "=0.22.1"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid"] }

time = { version = "=0.3.55", features = ["parsing", "formatting"] }
hmac = "=0.12.1"
ring = "=0.17.14"
zeroize = "=1.9.1"
futures-util = "=0.3.34"
chrono-tz = "=0.10.4"

[dev-dependencies]
socket2 = "=0.6.5"
tokio = { version = "=1.49.0", features = ["process", "test-util"] }
