[package]
name = "m-gated-adapter-deepseek-component"
version = "0.0.0"
edition = "2024"
publish = false
description = "The DeepSeek adapter as a WASM component (decision 0009). Build with scripts/build-adapter.sh."

[lib]
crate-type = ["cdylib"]

[dependencies]
m-gated-adapter-deepseek = { path = ".." }
m-gated-adapter-kit = { path = "../../../crates/adapter-kit" }
wit-bindgen = { version = "=0.62.0", default-features = false, features = ["macros", "realloc", "std"] }
